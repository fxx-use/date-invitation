<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6b7d8">
  <title>和我约会吧！</title>
  <style>
    :root {
      --pink: #f36fae;
      --pink-dark: #dd4d94;
      --pink-soft: #ffe5f1;
      --lilac: #cda7f2;
      --ink: #513c51;
      --muted: #897489;
      --white: #fffdfd;
      --shadow: 0 18px 50px rgba(118, 66, 113, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Arial Rounded MT Bold", "Microsoft YaHei", "PingFang SC",
        "Hiragino Sans GB", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.62) 0 4px, transparent 5px),
        radial-gradient(circle at 85% 21%, rgba(255,255,255,.48) 0 3px, transparent 4px),
        linear-gradient(145deg, #ffd1e5 0%, #e8c6fb 53%, #f8b7d9 100%);
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      width: 100%;
      min-height: 100svh;
      padding: max(28px, env(safe-area-inset-top)) 22px
        max(30px, env(safe-area-inset-bottom));
      isolation: isolate;
    }

    .app::before,
    .app::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 210px;
      height: 210px;
      border: 2px solid rgba(255,255,255,.34);
      border-radius: 48% 52% 57% 43%;
      animation: drift 8s ease-in-out infinite alternate;
    }

    .app::before { top: -72px; left: -70px; transform: rotate(24deg); }
    .app::after { right: -75px; bottom: -80px; animation-delay: -3s; }

    .decor {
      position: fixed;
      z-index: -1;
      color: rgba(255, 255, 255, .78);
      font-size: clamp(22px, 4vw, 38px);
      filter: drop-shadow(0 4px 5px rgba(186, 87, 145, .13));
      user-select: none;
      pointer-events: none;
      animation: float 4.5s ease-in-out infinite;
    }
    .d1 { top: 7%; left: 6%; }
    .d2 { top: 12%; right: 8%; animation-delay: -1.1s; }
    .d3 { bottom: 9%; left: 8%; animation-delay: -2.4s; }
    .d4 { right: 7%; bottom: 12%; animation-delay: -.7s; }
    .d5 { top: 50%; left: 3%; font-size: 24px; animation-delay: -3.1s; }
    .d6 { top: 45%; right: 3%; font-size: 25px; animation-delay: -1.8s; }

    .card {
      position: relative;
      justify-self: center;
      width: min(calc(100vw - 44px), 560px);
      min-height: 520px;
      padding: clamp(28px, 6vw, 48px);
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.84);
      border-radius: 34px;
      background: rgba(255, 253, 253, .9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 118px;
      height: 9px;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(90deg, #f6a2c9, #c9a3ee);
      transform: translateX(-50%);
    }

    .step {
      display: none;
      min-height: 420px;
      opacity: 0;
      text-align: center;
      transition: opacity .33s ease;
    }

    .step.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .step.visible { opacity: 1; }

    .avatar-wrap {
      position: relative;
      width: 148px;
      height: 148px;
      flex: 0 0 auto;
      border: 5px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffcfdf, #d7b8f2);
      box-shadow: 0 12px 28px rgba(195, 101, 157, .23);
      animation: bob 3s ease-in-out infinite;
    }

    .avatar-wrap::after {
      content: "♥";
      position: absolute;
      top: -7px;
      right: -5px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--pink);
      font-size: 18px;
      transform: rotate(10deg);
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
    }

    h1 {
      max-width: 460px;
      margin: 0;
      color: #4b394b;
      font-size: clamp(26px, 6vw, 34px);
      line-height: 1.36;
      letter-spacing: .02em;
    }

    .lead {
      max-width: 450px;
      margin: 0;
      font-size: clamp(17px, 3.8vw, 19px);
      line-height: 1.75;
    }

    .hint {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .button-row {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 58px;
    }

    .btn {
      min-width: 132px;
      min-height: 52px;
      padding: 13px 24px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #f77eb8, #e75da1);
      box-shadow: 0 9px 20px rgba(227, 84, 154, .25);
      font-weight: 800;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn:hover {
      filter: brightness(1.04);
      box-shadow: 0 11px 24px rgba(227, 84, 154, .34);
      transform: translateY(-2px);
    }

    .btn:active, .btn.pressed {
      transform: scale(.95);
    }

    .btn.secondary {
      color: #776d77;
      background: #e8e4e8;
      box-shadow: none;
    }

    #noBtn {
      position: relative;
      z-index: 3;
      transition: left .18s ease, top .18s ease, transform .14s ease;
    }

    .form-grid {
      display: grid;
      gap: 17px;
      width: 100%;
      margin: 4px 0;
      text-align: left;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      padding-left: 5px;
      color: #735d72;
      font-size: 15px;
      font-weight: 800;
    }

    input[type="date"],
    select {
      width: 100%;
      min-height: 54px;
      padding: 12px 16px;
      border: 2px solid #f4c3dc;
      outline: none;
      border-radius: 17px;
      color: var(--ink);
      background: #fff;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }

    input[type="date"]:focus,
    select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(243,111,174,.12);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .food {
      min-height: 52px;
      padding: 11px 8px;
      border: 2px solid #f4cede;
      border-radius: 16px;
      color: #70556a;
      background: #fff8fb;
      font-weight: 800;
      cursor: pointer;
      transition: transform .14s, color .2s, background .2s, border-color .2s, box-shadow .2s;
    }

    .food:hover { transform: translateY(-2px); border-color: #ee9bc3; }
    .food:active { transform: scale(.95); }
    .food.selected {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #f887ba, #df62a5);
      box-shadow: 0 7px 16px rgba(226, 91, 157, .22);
    }

    .food .emoji {
      display: inline-block;
      margin-right: 5px;
      font-size: 18px;
    }

    .selection-note {
      min-height: 24px;
      margin: -5px 0 0;
      color: var(--pink-dark);
      font-size: 14px;
      font-weight: 700;
    }

    .summary {
      display: grid;
      gap: 14px;
      width: 100%;
      padding: 22px;
      border: 2px dashed #efa7ca;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff8fb, #fbf7ff);
      text-align: left;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 10px;
      align-items: start;
      padding-bottom: 12px;
      border-bottom: 1px solid #f2d9e5;
      font-size: 15px;
      line-height: 1.55;
    }
    .summary-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .summary-label { color: #a07091; font-weight: 800; }
    .summary-value { color: #503e4e; font-weight: 700; word-break: break-word; }

    .final-note {
      margin: 0;
      color: var(--pink-dark);
      font-size: 16px;
      font-weight: 800;
    }

    .tiny-heart {
      display: inline-block;
      color: var(--pink);
      animation: heartbeat 1.25s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-12px) rotate(7deg); }
    }
    @keyframes drift {
      to { transform: translate(10px, 15px) rotate(40deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.2); }
    }

    @media (max-width: 560px) {
      .app { padding-inline: 14px; }
      .card {
        width: calc(100vw - 28px);
        min-height: min(690px, calc(100svh - 30px));
        padding: 30px 20px;
        border-radius: 27px;
      }
      .step { min-height: calc(100svh - 94px); }
      .avatar-wrap { width: 130px; height: 130px; }
      .button-row { flex-direction: column; min-height: 120px; }
      .btn { width: 100%; min-height: 54px; }
      #noBtn { width: min(100%, 180px); }
      .food-grid { gap: 10px; }
      .food { min-height: 50px; }
      .decor.d5, .decor.d6 { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <span class="decor d1">✿</span>
    <span class="decor d2">♥</span>
    <span class="decor d3">✦</span>
    <span class="decor d4">❀</span>
    <span class="decor d5">♡</span>
    <span class="decor d6">★</span>

    <section class="card" aria-live="polite">
      <div class="step active visible" data-step="1">
        <div class="avatar-wrap" aria-label="一只可爱的法斗头像">
          <svg class="avatar" viewBox="0 0 160 160" role="img" aria-hidden="true">
            <ellipse cx="80" cy="112" rx="51" ry="32" fill="#eee7df"/>
            <path d="M41 66 31 27c-2-8 6-14 13-9l28 21M119 66l10-39c2-8-6-14-13-9L88 39" fill="#6c5a55"/>
            <path d="M47 66 40 38l22 18M113 66l7-28-22 18" fill="#e8b0ad"/>
            <ellipse cx="80" cy="82" rx="48" ry="47" fill="#f3ede5"/>
            <path d="M45 60c13-19 57-28 72 2-17-6-28 3-37 12-12-11-22-17-35-14Z" fill="#d2c5bb"/>
            <ellipse cx="59" cy="78" rx="9" ry="11" fill="#403534"/>
            <ellipse cx="101" cy="78" rx="9" ry="11" fill="#403534"/>
            <circle cx="62" cy="75" r="2.7" fill="#fff"/>
            <circle cx="104" cy="75" r="2.7" fill="#fff"/>
            <ellipse cx="80" cy="102" rx="24" ry="20" fill="#fff9f3"/>
            <path d="M70 96c0-8 20-8 20 0 0 5-5 8-10 8s-10-3-10-8Z" fill="#4a3a39"/>
            <path d="M80 104c0 8-11 10-14 4M80 104c0 8 11 10 14 4" fill="none" stroke="#6a4c4a" stroke-width="3" stroke-linecap="round"/>
            <path d="M74 116c4 4 8 4 12 0-1 10-11 10-12 0Z" fill="#ef8ba0"/>
            <circle cx="47" cy="96" r="7" fill="#f5b4bd" opacity=".55"/>
            <circle cx="113" cy="96" r="7" fill="#f5b4bd" opacity=".55"/>
          </svg>
        </div>
        <h1>可以和我一起约会吗？！</h1>
        <div class="button-row" id="choiceArea">
          <button class="btn" id="yesBtn" type="button">愿意</button>
          <button class="btn secondary" id="noBtn" type="button">不要</button>
        </div>
        <p class="hint">系统检测到，对方已经紧张到开始写网页了。</p>
      </div>

      <div class="step" data-step="2">
        <div class="avatar-wrap" aria-hidden="true">
          <svg class="avatar" viewBox="0 0 160 160">
            <ellipse cx="80" cy="112" rx="51" ry="32" fill="#eee7df"/>
            <path d="M41 66 31 27c-2-8 6-14 13-9l28 21M119 66l10-39c2-8-6-14-13-9L88 39" fill="#6c5a55"/>
            <path d="M47 66 40 38l22 18M113 66l7-28-22 18" fill="#e8b0ad"/>
            <ellipse cx="80" cy="82" rx="48" ry="47" fill="#f3ede5"/>
            <ellipse cx="58" cy="79" rx="8" ry="11" fill="#403534"/><ellipse cx="102" cy="79" rx="8" ry="11" fill="#403534"/>
            <circle cx="61" cy="75" r="3" fill="#fff"/><circle cx="105" cy="75" r="3" fill="#fff"/>
            <ellipse cx="80" cy="102" rx="24" ry="20" fill="#fff9f3"/>
            <path d="M70 96c0-8 20-8 20 0 0 5-5 8-10 8s-10-3-10-8Z" fill="#4a3a39"/>
            <path d="M80 104c0 8-11 10-14 4M80 104c0 8 11 10 14 4" fill="none" stroke="#6a4c4a" stroke-width="3" stroke-linecap="round"/>
            <circle cx="45" cy="97" r="9" fill="#f4a7b6" opacity=".7"/><circle cx="115" cy="97" r="9" fill="#f4a7b6" opacity=".7"/>
          </svg>
        </div>
        <p class="lead">等下，你真的点了愿意？？<br>我都已经准备好被你点“不要”了。</p>
        <button class="btn" id="continueBtn" type="button">好啦好啦～</button>
      </div>

      <div class="step" data-step="3">
        <h1>所以…你什么时候有空？</h1>
        <p class="lead">挑一个值得期待的日子吧 <span class="tiny-heart">♥</span></p>
        <div class="form-grid">
          <div class="field">
            <label for="dateInput">约会日期</label>
            <input id="dateInput" type="date" required>
          </div>
          <div class="field">
            <label for="timeInput">见面时间</label>
            <select id="timeInput" required>
              <option value="12:00">12:00</option>
              <option value="13:00">13:00</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
            </select>
          </div>
        </div>
        <button class="btn" id="timeConfirmBtn" type="button">确定时间</button>
      </div>

      <div class="step" data-step="4">
        <h1>我们吃点什么？</h1>
        <p class="lead">可以多选，喜欢的都点上！</p>
        <div class="food-grid" id="foodGrid">
          <button class="food" type="button" data-food="披萨"><span class="emoji">🍕</span>披萨</button>
          <button class="food" type="button" data-food="寿司"><span class="emoji">🍣</span>寿司</button>
          <button class="food" type="button" data-food="火锅"><span class="emoji">🍲</span>火锅</button>
          <button class="food" type="button" data-food="烤肉"><span class="emoji">🥩</span>烤肉</button>
          <button class="food" type="button" data-food="早茶"><span class="emoji">🥟</span>早茶</button>
          <button class="food" type="button" data-food="拉面"><span class="emoji">🍜</span>拉面</button>
          <button class="food" type="button" data-food="麻辣烫"><span class="emoji">🌶️</span>麻辣烫</button>
          <button class="food" type="button" data-food="小龙虾"><span class="emoji">🦞</span>小龙虾</button>
          <button class="food" type="button" data-food="烧烤"><span class="emoji">🍢</span>烧烤</button>
          <button class="food" type="button" data-food="其他"><span class="emoji">✨</span>其他</button>
        </div>
        <p class="selection-note" id="selectionNote">还没选呢～</p>
        <button class="btn" id="foodConfirmBtn" type="button" disabled>选好啦</button>
      </div>

      <div class="step" data-step="5">
        <div class="avatar-wrap" aria-hidden="true">
          <svg class="avatar" viewBox="0 0 160 160">
            <ellipse cx="80" cy="112" rx="51" ry="32" fill="#eee7df"/>
            <path d="M41 66 31 27c-2-8 6-14 13-9l28 21M119 66l10-39c2-8-6-14-13-9L88 39" fill="#6c5a55"/>
            <path d="M47 66 40 38l22 18M113 66l7-28-22 18" fill="#e8b0ad"/>
            <ellipse cx="80" cy="82" rx="48" ry="47" fill="#f3ede5"/>
            <path d="M49 77c6-7 13-7 19 0M92 77c6-7 13-7 19 0" fill="none" stroke="#403534" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="80" cy="102" rx="24" ry="20" fill="#fff9f3"/>
            <path d="M70 96c0-8 20-8 20 0 0 5-5 8-10 8s-10-3-10-8Z" fill="#4a3a39"/>
            <path d="M63 108c7 17 27 17 34 0" fill="#f292a5" stroke="#6a4c4a" stroke-width="3" stroke-linecap="round"/>
            <circle cx="45" cy="96" r="9" fill="#f4a7b6" opacity=".72"/><circle cx="115" cy="96" r="9" fill="#f4a7b6" opacity=".72"/>
          </svg>
        </div>
        <h1>真开心你没有拒绝～<br>我会准时来接你！</h1>
        <div class="summary">
          <div class="summary-row"><span class="summary-label">日期</span><span class="summary-value" id="resultDate"></span></div>
          <div class="summary-row"><span class="summary-label">时间</span><span class="summary-value" id="resultTime"></span></div>
          <div class="summary-row"><span class="summary-label">餐饮</span><span class="summary-value" id="resultFood"></span></div>
        </div>
        <p class="final-note">带好胃口，我带好路线。<span class="tiny-heart">♥</span></p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const steps = [...document.querySelectorAll(".step")];
      const state = { date: "", time: "12:00", foods: new Set() };
      let currentStep = 1;

      function showStep(number) {
        const oldStep = steps.find(step => step.classList.contains("active"));
        const nextStep = steps.find(step => Number(step.dataset.step) === number);
        if (!nextStep || number === currentStep) return;

        oldStep.classList.remove("visible");
        window.setTimeout(() => {
          oldStep.classList.remove("active");
          nextStep.classList.add("active");
          requestAnimationFrame(() => requestAnimationFrame(() => nextStep.classList.add("visible")));
          currentStep = number;
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, 330);
      }

      const today = new Date();
      const localToday = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");
      const dateInput = document.getElementById("dateInput");
      dateInput.min = localToday;
      dateInput.value = localToday;

      document.getElementById("yesBtn").addEventListener("click", () => showStep(2));
      document.getElementById("continueBtn").addEventListener("click", () => showStep(3));

      const noBtn = document.getElementById("noBtn");
      const choiceArea = document.getElementById("choiceArea");

      function dodgeNoButton(event) {
        if (event) event.preventDefault();
        const area = choiceArea.getBoundingClientRect();
        const button = noBtn.getBoundingClientRect();
        const maxX = Math.max(0, Math.min(150, area.width / 2 - button.width / 2));
        const maxY = window.innerWidth <= 560 ? 35 : 44;
        let x = (Math.random() * 2 - 1) * maxX;
        let y = (Math.random() * 2 - 1) * maxY;
        if (Math.abs(x) < 48) x += x < 0 ? -58 : 58;
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      }

      noBtn.addEventListener("mouseenter", dodgeNoButton);
      noBtn.addEventListener("pointerdown", dodgeNoButton);
      noBtn.addEventListener("focus", dodgeNoButton);

      document.getElementById("timeConfirmBtn").addEventListener("click", () => {
        if (!dateInput.value) {
          dateInput.focus();
          return;
        }
        state.date = dateInput.value;
        state.time = document.getElementById("timeInput").value;
        showStep(4);
      });

      const foodButtons = [...document.querySelectorAll(".food")];
      const selectionNote = document.getElementById("selectionNote");
      const foodConfirmBtn = document.getElementById("foodConfirmBtn");

      foodButtons.forEach(button => {
        button.addEventListener("click", () => {
          const food = button.dataset.food;
          if (state.foods.has(food)) {
            state.foods.delete(food);
            button.classList.remove("selected");
            button.setAttribute("aria-pressed", "false");
          } else {
            state.foods.add(food);
            button.classList.add("selected");
            button.setAttribute("aria-pressed", "true");
          }
          foodConfirmBtn.disabled = state.foods.size === 0;
          foodConfirmBtn.style.opacity = state.foods.size ? "1" : ".55";
          selectionNote.textContent = state.foods.size
            ? `已选 ${state.foods.size} 项：${[...state.foods].join("、")}`
            : "还没选呢～";
        });
        button.setAttribute("aria-pressed", "false");
      });
      foodConfirmBtn.style.opacity = ".55";

      foodConfirmBtn.addEventListener("click", () => {
        if (!state.foods.size) return;
        const [year, month, day] = state.date.split("-");
        document.getElementById("resultDate").textContent = `${year}年${Number(month)}月${Number(day)}日`;
        document.getElementById("resultTime").textContent = state.time;
        document.getElementById("resultFood").textContent = [...state.foods].join("、");
        showStep(5);
      });

      document.querySelectorAll("button").forEach(button => {
        button.addEventListener("pointerdown", () => button.classList.add("pressed"));
        ["pointerup", "pointerleave", "pointercancel"].forEach(type => {
          button.addEventListener(type, () => button.classList.remove("pressed"));
        });
      });
    })();
  </script>
</body>
</html>
